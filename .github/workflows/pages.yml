# Publishes site/ to GitHub Pages on every push, and every 3 hours to refresh the news and
# report feeds (tools/fetch_feeds.py; GitHub Pages can't relay them live like Netlify did).
name: Publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news and report feeds
        run: python3 tools/fetch_feeds.py site
        env:
          SITE_URL: https://fineganmark.github.io/${{ github.event.repository.name }}/
      - name: Fetch UN Comtrade trade totals
        run: |
          mkdir -p site/data/live
          curl -sfL "https://fineganmark.github.io/${{ github.event.repository.name }}/data/live/comtrade_lbr.json" -o site/data/live/comtrade_lbr.json || rm -f site/data/live/comtrade_lbr.json
          python3 tools/fetch_comtrade.py site
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
      - name: Fetch ACLED conflict events
        run: |
          mkdir -p site/data/live
          curl -sfL "https://fineganmark.github.io/${{ github.event.repository.name }}/data/live/acled_lbr.json" -o site/data/live/acled_lbr.json || rm -f site/data/live/acled_lbr.json
          python3 tools/fetch_acled.py site
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
      - name: Refresh development indicators
        # Full download on pushes, manual runs and the Monday 03:17 UTC run (weekly); the other 3-hourly runs reuse
        # the live copy. If the build fails, or ends up with under half the live copy's indicators (a source outage),
        # the live copy stays. A smaller failure only drops that source's indicators.
        run: |
          live="https://fineganmark.github.io/${{ github.event.repository.name }}/data/indicators.js"
          curl -sfL "$live" -o site/data/indicators.js || rm -f site/data/indicators.js
          if [ "${{ github.event_name }}" != schedule ] || { [ "$(date -u +%u)" = 1 ] && [ "$(date -u +%-H)" -ge 3 ] && [ "$(date -u +%-H)" -lt 6 ]; } || [ ! -s site/data/indicators.js ]; then
            python3 tools/fetch_indicators.py "$RUNNER_TEMP/indicators-raw"
            cp site/data/indicators.js "$RUNNER_TEMP/indicators-live.js" 2>/dev/null || true
            python3 tools/build_indicators.py || cp "$RUNNER_TEMP/indicators-live.js" site/data/indicators.js
            python3 tools/keep_indicators.py "$RUNNER_TEMP/indicators-live.js" site/data/indicators.js \
              || cp "$RUNNER_TEMP/indicators-live.js" site/data/indicators.js
          else
            echo "reusing the live indicators.js (weekly refresh runs on Mondays)"
          fi
        env:
          LBR_IND_RAW: ${{ runner.temp }}/indicators-raw
          LBR_IND_OUT: site/data/indicators.js
          LBR_MAPS: site/data/maps.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
