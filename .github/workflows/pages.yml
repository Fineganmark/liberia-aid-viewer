# Publishes site/ to GitHub Pages on every push, and every 3 hours to refresh the news and
# report feeds (tools/fetch_feeds.py; GitHub Pages can't relay them live like Netlify did).
name: Publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news and report feeds
        run: python3 tools/fetch_feeds.py site
        env:
          SITE_URL: https://fineganmark.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
